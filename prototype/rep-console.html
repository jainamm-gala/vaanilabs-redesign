<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Offline · Rep console · Vaani Labs</title>
<meta name="description" content="Vaani Labs redesign prototype: the Rep console, a browser softphone for calls that a flow’s Transfer step hands to a person. Presence is explicit: nothing connects until you go available.">
<meta name="theme-color" content="">
<!-- THEME_BOOT (01-foundations §15.3): theme, motion, sidebar and single-key preferences before first paint. Keep verbatim. -->
<script>(function(){var d=document.documentElement,g=function(k){try{return localStorage.getItem(k)}catch(e){return null}};var t=g('vaani:theme')||'system';if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';d.setAttribute('data-theme',t);if(g('vaani:motion')==='reduce')d.setAttribute('data-motion','reduce');if(g('vaani:sidebar')==='collapsed')d.setAttribute('data-sidebar','collapsed');d.setAttribute('data-shortcuts',g('vaani:shortcuts')==='off'?'off':'on');})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&display=swap&text=%E2%82%B9" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@500&family=Noto+Sans+Telugu:wght@500&family=Noto+Sans+Bengali:wght@500&family=Noto+Sans+Gujarati:wght@500&family=Noto+Sans+Kannada:wght@500&family=Noto+Sans+Malayalam:wght@500&family=Noto+Sans+Gurmukhi:wght@500&family=Noto+Sans+Oriya:wght@500&display=swap&text=%E0%AE%A4%E0%B0%A4%E0%B1%86%E0%A6%AC%E0%AA%97%E0%B2%95%E0%B4%AE%E0%A8%AA%E0%AC%93" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/components.css">
<link rel="stylesheet" href="pages/rep-console.css">
<script src="assets/icons.js" defer></script>
<script src="assets/data.js" defer></script>
<script src="assets/shell.js" defer></script>
<!-- rep-console-view.js renders; rep-console.js holds the presence machine (CK §5.3) and boots. -->
<script src="pages/rep-console-view.js" defer></script>
<script src="pages/rep-console.js" defer></script>
</head>
<body data-page="rep-console">
<a class="skip-link" href="#main">Skip to main content</a>
<div class="app">
  <nav class="sb" aria-label="Main" data-vaani="sidebar"></nav>
  <nav class="rail" aria-label="Main" data-vaani="rail"></nav>
  <div class="topbar topbar--auto" role="region" aria-label="Page title and status" data-vaani="topbar"></div>
  <div class="app-col">
    <main id="main" class="app-main app-main--frame rc-main" tabindex="-1" data-focus-target>
      <!-- PageHeader: H1 "Rep console", meta from the availability machine, ⋯ with Phone setup and Keyboard shortcuts. No back link. -->
      <div class="ph" id="rc-ph">
        <div class="ph-title">
          <h1 id="page-title">Rep console</h1>
          <span class="ph-meta" id="rc-meta">Offline</span>
        </div>
        <div class="ph-actions">
          <span class="rc-proto">
            <button class="btn btn--sm btn--tertiary proto-btn" type="button" data-popover="rc-proto" data-placement="bottom-end" aria-haspopup="dialog" aria-expanded="false" aria-label="Prototype states"><i data-icon="sliders-horizontal" data-size="sm"></i><span class="u-hide-phone">Prototype states</span></button>
          </span>
          <button class="ibtn" type="button" aria-label="More actions" aria-haspopup="menu" aria-controls="rc-more" aria-expanded="false"><i data-icon="ellipsis"></i></button>
        </div>
      </div>
      <div class="menu" id="rc-more" role="menu" aria-label="More actions" hidden>
        <a class="menu-item" role="menuitem" href="settings.html#phone"><i data-icon="phone"></i><span class="menu-text"><span>Phone setup</span><span class="menu-desc">Call channel, numbers, transfers</span></span></a>
        <button class="menu-item" role="menuitem" type="button" data-vaani-action="shortcuts"><i data-icon="keyboard"></i><span class="menu-text"><span>Keyboard shortcuts</span></span></button>
      </div>
      <!-- One page notice at a time: phone caveat, another tab, bridge unavailable, or the WalletNotice. -->
      <div class="rc-notice" id="rc-notice" hidden></div>
      <div class="rc-body" id="rc-body" data-state="offline">
        <section class="rc-col rc-soft" aria-labelledby="rc-soft-h">
          <div class="rc-scroll"><div class="rc-pad">
            <h2 class="rc-colhead" id="rc-soft-h" tabindex="-1" data-focus-target>Softphone</h2>
            <div id="rc-soft" class="rc-stack"></div>
          </div></div>
        </section>
        <!-- CallControls variant="rep" (§7.7): the softphone’s sticky footer; above the BottomBar on phones. -->
        <div class="rc-bar" id="rc-bar" role="toolbar" aria-label="Call controls" hidden></div>
        <section class="rc-col rc-ctx" aria-labelledby="rc-ctx-h">
          <div class="rc-scroll"><div class="rc-pad" id="rc-ctx"></div></div>
        </section>
      </div>
    </main>
    <div class="bl" role="region" aria-label="Workspace status" data-baseline data-vaani="baseline"></div>
  </div>
  <nav class="bbar" aria-label="Main" data-vaani="bottombar"></nav>
</div>
<div class="toast-region" role="region" aria-label="Notifications" data-vaani="toasts"></div>
<div class="sr-only" role="status" aria-live="polite" data-vaani="announcer"></div>
<div class="portal" data-vaani="portal"></div>

<!-- ============ PAGE OVERLAYS ============ -->
<div class="pop pop--wide" id="rc-proto" aria-labelledby="rc-proto-t" hidden>
  <div class="pop-head"><h2 class="pop-title" id="rc-proto-t">Prototype states <span class="tag tag--outline">Prototype only</span></h2><button class="ibtn ibtn--sm" type="button" data-popover-close aria-label="Close"><i data-icon="x"></i></button></div>
  <div class="pop-body" id="rc-proto-body"></div>
</div>
<!-- Keypad (KeypadPopover, CK §7.7): 3 × 4 keys of 44 px; sends tones; echoes digits read-only. -->
<div class="pop" id="rc-keypad" aria-labelledby="rc-keypad-t" hidden>
  <div class="pop-head"><h2 class="pop-title" id="rc-keypad-t">Keypad</h2><button class="ibtn ibtn--sm" type="button" data-popover-close aria-label="Close keypad"><i data-icon="x"></i></button></div>
  <div class="pop-body" id="rc-keypad-body"></div>
</div>
<!-- TransferPicker (CK §7.8) -->
<div class="pop" id="rc-transfer" aria-labelledby="rc-tr-t" hidden></div>
<!-- Phone bar ⋯ (Hold, Keypad, Transfer… below 768) -->
<div class="menu" id="rc-bar-menu" role="menu" aria-label="More call controls" hidden>
  <button class="menu-item" role="menuitem" type="button" data-value="hold"><i data-icon="pause"></i><span class="menu-text"><span id="rc-bm-hold">Hold</span></span></button>
  <button class="menu-item" role="menuitem" type="button" data-value="keypad"><i data-icon="grid-3x3"></i><span class="menu-text"><span>Keypad</span></span></button>
  <button class="menu-item" role="menuitem" type="button" data-value="transfer"><i data-icon="phone-forwarded"></i><span class="menu-text"><span>Transfer…</span></span></button>
</div>
<div class="pop pop--info" id="rc-mic-pop" aria-labelledby="rc-mic-t" hidden>
  <div class="pop-head"><h2 class="pop-title" id="rc-mic-t">Allow the microphone</h2><button class="ibtn ibtn--sm" type="button" data-popover-close aria-label="Close"><i data-icon="x"></i></button></div>
  <div class="pop-body"><ol class="rc-steps"><li>Click the lock or site icon beside the address.</li><li>Set Microphone to Allow.</li><li>Come back and press Retry.</li></ol></div>
</div>
</body>
</html>
