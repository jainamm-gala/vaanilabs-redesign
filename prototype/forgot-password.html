<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Reset password · Vaani Labs</title>
<meta name="description" content="Vaani Labs redesign prototype: reset your password and set a new one (08-public-auth §10), with the sent, expired, used and invalid link states.">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="">
<!-- THEME_BOOT (01-foundations §15.3): the same pre-paint script and vaani:theme key as the app (PA2). Keep verbatim. -->
<script>(function(){var d=document.documentElement,g=function(k){try{return localStorage.getItem(k)}catch(e){return null}};var t=g('vaani:theme')||'system';if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';d.setAttribute('data-theme',t);if(g('vaani:motion')==='reduce')d.setAttribute('data-motion','reduce');if(g('vaani:sidebar')==='collapsed')d.setAttribute('data-sidebar','collapsed');d.setAttribute('data-shortcuts',g('vaani:shortcuts')==='off'?'off':'on');})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&display=swap&text=%E2%82%B9" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/components.css">
<link rel="stylesheet" href="pages/auth.css">
<script src="assets/icons.js" defer></script>
<script src="assets/data.js" defer></script>
<script src="assets/shell.js" defer></script>
<script src="pages/auth.js" defer></script>
<script src="pages/auth-forms.js" defer></script>
<script src="pages/auth-recovery.js" defer></script>
</head>
<!-- AuthLayout, bare shell (08-public-auth §4.2). Routes served by this file:
       forgot-password.html                    /forgot-password            Reset your password → (same URL) Check your email
       forgot-password.html?token=valid        /reset-password?token=…     Set a new password
       forgot-password.html?token=expired|used|invalid                     the three link failures, each with its own H1
     The token is dropped from the address bar after load (history.replaceState), as the real route does. -->
<body data-page="forgot-password" class="auth-body">
<a class="skip-link" href="#main">Skip to main content</a>

<div class="auth-page" data-layout="single" data-inert-root>
  <header class="auth-head">
    <a class="auth-lockup" href="#" data-offsite="The home page" aria-label="Vaani Labs home"><svg class="mark" aria-hidden="true" focusable="false"><use href="#vl-mark"/></svg><span aria-hidden="true">Vaani Labs</span></a>
  </header>

  <main id="main" class="auth-main" tabindex="-1" data-focus-target>
    <!-- ============ The panel. This static markup is the request view; auth-recovery.js renders the other states. ============ -->
    <div class="auth-panel" data-view-root>
      <h1 class="auth-h1">Reset your password</h1>
      <p class="auth-sub">Enter the email you use for Vaani Labs. We’ll send a link to set a new password. It works for 60 minutes.</p>
      <div class="auth-notice-slot" data-notice></div>
      <form class="auth-form" id="fp-form" action="forgot-password.html" method="post" novalidate>
        <div class="field">
          <label class="field-label" for="fp-email">Email</label>
          <!-- No leading icon (F-QA-031): nothing can overlap the text at any width. -->
          <div class="input input--lg"><input id="fp-email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" enterkeyhint="send" required></div>
        </div>
        <div class="auth-actions">
          <div class="auth-formerr" data-formerr></div>
          <button type="submit" class="btn btn--primary btn--lg btn--full" data-auth-primary data-offline="You’re offline. Connect to get a reset link."><span data-label>Send reset link</span></button>
          <a class="auth-link auth-link--block" href="login.html" data-back>Back to sign in</a>
        </div>
      </form>
    </div>
  </main>

  <nav class="auth-legal" aria-label="Legal">
    <ul>
      <li><a href="#" data-offsite="The privacy policy">Privacy</a></li>
      <li><a href="#" data-offsite="The terms">Terms</a></li>
      <li><a href="#" data-offsite="The security overview">Security</a></li>
      <li><a href="#" data-offsite="The status page">Status</a></li>
    </ul>
  </nav>

  <!-- Prototype-only control (not part of the design): opens "Prototype states". Filled by pages/auth.js. -->
  <aside class="auth-proto" aria-label="Prototype controls"></aside>
</div>

<div class="toast-region" role="region" aria-label="Notifications" data-vaani="toasts"></div>
<div class="sr-only" role="status" aria-live="polite" data-vaani="announcer"></div>
<div class="portal" data-vaani="portal"></div>
</body>
</html>
