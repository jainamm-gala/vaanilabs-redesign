<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Vaani Labs">
  <!-- Vaani Labs mark, working version ("the cord"): one thread splits into two strands, the agent's voice and the
       caller's, which twist over and under each other and join again. Tile = --mark-bg (Neel-ink #0F203D), strands = --mark-fg (#FFFFFF).
       32 grid: stroke 2.25, 1.3 gap at each crossing, tile radius 7. Canonical source for the inline symbol in mark-symbol.html. -->
  <mask id="a" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32"><rect width="32" height="32" fill="white"/><path d="M18.9 13.56L21.1 18.44" stroke="black" stroke-width="4.85"/></mask>
  <mask id="b" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32"><rect width="32" height="32" fill="white"/><path d="M10.9 13.56L13.1 18.44" stroke="black" stroke-width="4.85"/></mask>
  <rect width="32" height="32" rx="7" fill="#0F203D"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
    <path mask="url(#a)" d="M3.5 16C6.8 16 8.45 8.1 12 16C15.6 24 16.4 24 20 16C23.55 8.1 25.2 16 28.5 16"/>
    <path mask="url(#b)" d="M3.5 16C6.8 16 8.45 23.9 12 16C15.6 8 16.4 8 20 16C23.55 23.9 25.2 16 28.5 16"/>
  </g>
</svg>
